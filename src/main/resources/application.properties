spring.application.name=facturacion-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:facturas}
spring.datasource.username=${DB_USER:fact_user}
spring.datasource.password=${DB_PASSWORD:T0byt081*}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# URL base del document-service (RestClientConfig la necesita para poder arrancar).
# En local por defecto apunta a localhost:8083; en k8s se sobreescribe con la
# variable de entorno DOCUMENT_SERVICE_URL apuntando al Service de document-service.
document-service.url=${DOCUMENT_SERVICE_URL:http://localhost:8083}
# Timeouts de la llamada a document-service
document-service.connect-timeout-ms=${DOCUMENT_SERVICE_CONNECT_TIMEOUT_MS:2000}
document-service.read-timeout-ms=${DOCUMENT_SERVICE_READ_TIMEOUT_MS:30000}

# Datos por defecto del emisor para que el PDF nunca salga con la cabecera vacía.
# En Kubernetes se pueden sobreescribir con COMPANY_* .
invoice.company.name=${COMPANY_NAME:Mi Empresa}
invoice.company.tax-id=${COMPANY_TAX_ID:B00000000}
invoice.company.address=${COMPANY_ADDRESS:Calle Principal 1, Madrid}
invoice.company.email=${COMPANY_EMAIL:facturacion@example.com}
